# Example policy file for QueryGate.
#
# `default` applies to any connection with no entry under `connections`.
# Each entry under `connections` is merged on top of `default` (so you only
# need to specify what differs). Set POLICY_FILE to point at your
# own copy of this file.
#
# `principals` (optional) layers a further override on top of whichever of
# the above applies, keyed by the authenticated caller's Principal.subject —
# an API key's configured subject, or a JWT's subject claim. Without this,
# every caller of a connection gets identical access. Each principal entry
# is keyed by connection id, or "*" for every connection; a connection-
# specific entry wins over "*" for the same principal. See the `principals`
# block below.

default:
  # The runnable demo is permissive for quickstart convenience. For a
  # production deny-by-default posture, set this to false and explicitly set
  # enabled: true only for allowed principal/connection pairs below.
  enabled: true
  max_joins: 4
  max_select_columns: 20
  max_where_depth: 4
  max_group_by: 8
  max_limit: 100
  max_limit_aggregate: 1000
  default_limit: 50
  max_top_n: 50
  max_partition_by: 5
  max_batch_size: 10

  # Resource-exhaustion guardrails max_where_depth/max_joins/etc. above don't
  # cover: a single-level `or` with thousands of terms passes depth checks,
  # and an `in`/`not_in` predicate's value list has no other size cap.
  max_where_predicates: 100
  max_in_list_size: 1000

  # Caps the number of WHEN branches in a single CASE — anywhere it appears,
  # including a CASE nested inside an aggregate argument or arithmetic.
  max_case_branches: 10

  # Bounds on the scalar expression substrate (arithmetic, nested functions,
  # conditional aggregation — TODO.md item 100). These are what make the
  # expression grammar *bounded* rather than open-ended: max_expression_depth
  # limits how deeply one expression may nest, and max_expression_nodes limits
  # total expression size summed across the query AND every subquery, so
  # nesting can't multiply the budget.
  max_expression_depth: 5
  max_expression_nodes: 200

  # Bounds on window functions (TODO.md item 101). max_window_specs counts the
  # window projections in a query summed across it AND every subquery — each one
  # is a potential extra sort — and 0 disables window functions entirely for this
  # connection. max_window_frame_offset bounds how far from the current row a
  # window may reach: an `N PRECEDING`/`N FOLLOWING` frame bound and a lag/lead
  # row offset. A window's PARTITION BY columns count against max_partition_by,
  # the same budget top_n uses.
  max_window_specs: 5
  max_window_frame_offset: 1000

  # How many SELECTs one set operation may combine (TODO.md item 104), counting
  # the query that carries `set_op` as arm 1 and summed across the query AND
  # every subquery. 0 (or 1) disables UNION/INTERSECT/EXCEPT entirely for this
  # connection. Note what this does NOT bound: every other cap above
  # (max_joins, max_select_columns, max_where_predicates, max_expression_nodes)
  # is already summed across the arms, so N arms share one budget — this bounds
  # only the number of independent scans plus the dedup sort a non-ALL set
  # operation adds. (The COUNT caps are what get summed; the per-tree/per-node
  # bounds above — max_where_depth, max_expression_depth, max_window_frame_offset
  # — are not summed and apply to each arm on its own.) Raise it if analysts
  # routinely combine more segments.
  max_set_op_arms: 3

  # Named WITH blocks — ctes (TODO.md item 105). How many multi-stage blocks one
  # query may declare; 0 turns the feature off for this connection. Not summed
  # tree-wide because only the ROOT query may declare them, so there is no second
  # place for a count to hide — but every COUNT cap above already counts each
  # block's body, so N blocks share one budget rather than each getting a fresh
  # one. Note what does NOT bound a block: max_rows is deliberately not applied to
  # one, because a block's rows are input to a join or an aggregate and truncating
  # them would silently change a total rather than refuse the query. What bounds a
  # block is timeout_seconds, max_response_bytes and the concurrency limiter.
  max_cte_count: 3

  # Correlated subquery references (TODO.md item 106). How many OUTER columns a
  # query tree's subqueries may declare in their `correlate` lists, summed
  # tree-wide; 0 disables correlation entirely and keeps this connection on the
  # pre-106 model where a subquery resolves only against its own tables.
  #
  # This caps the correlation SURFACE, not its cost, and the distinction matters:
  # a correlated subquery is re-evaluated per candidate outer row, so its cost is
  # driven by the outer scan, which no count here bounds — timeout_seconds, the
  # concurrency limiter and (where enabled) the cost gate do. What this bounds is
  # how many outer columns a nested scope can pull into its namespace, which is
  # the policy/masking surface and the part that must not grow silently. Every
  # declared ref is checked against the ENCLOSING query's table/column allow-deny
  # and mask rules; an undeclared outer reference is rejected outright.
  max_correlated_refs: 2

  # CROSS JOIN (TODO.md item 103) — deny-by-default, and the only join type that
  # needs an explicit opt-in. Every other join must connect to the query's table
  # graph, so before item 103 a cartesian product could not be expressed at all;
  # `cross` is the one join whose cost is the PRODUCT of its inputs rather than
  # bounded by a key. Leave it false unless a connection genuinely needs
  # cartesian expansion. Cross joins still count against max_joins, and the
  # always-on bound on one is timeout_seconds — LIMIT bounds rows returned, not
  # work done, so pair this with max_estimated_rows below if you enable it.
  allow_cross_join: false

  # How far one relative-date shift may reach (TODO.md item 102), so
  # date_add(now(), 'day', -30) is a bounded lookback rather than an open one.
  # The magnitude is converted to days with UPPER-bound unit lengths (a year
  # counts as 366 days, a month as 31), so a bigger unit can't slip a bigger
  # reach past the cap. This is NOT a row-count guardrail — a caller who wants
  # everything just omits the filter, which max_limit and mandatory_row_filters
  # bound. It stops a caller-triggerable server error (a 10,000-year LOOKBACK
  # overflows SQL Server's datetime range and makes Postgres raise "timestamp
  # out of range"; forward, Postgres is fine until ~292,000 years) and keeps a
  # relative filter honestly bounded. The default is 10 x 366 — ten years
  # counted the way the cap counts a year, so `unit: year, amount: -10` fits.
  # 0 permits only a no-op shift, the closest thing to disabling relative dates.
  # NOTE: every date answer is UTC — QueryGate pins the Postgres session to UTC
  # so EXTRACT/date_trunc don't silently follow the server's configured zone.
  max_interval_days: 3660

  timeout_seconds: 30
  max_concurrency: 8
  concurrency_wait_seconds: 10

  # Queue-depth pressure controls (TODO.md item 35 phase 2). Unset by
  # default: no limit on how many callers may wait for a slot at once, same
  # as before this existed. max_concurrency bounds how many queries may
  # *run*; these bound how many may *wait* — without a cap, a burst of
  # queue_mode=wait callers against a saturated connection can itself become
  # a resource-exhaustion vector. Uncomment to bound it: a caller past
  # either cap is rejected immediately (queue_wait_ms: 0, admission_state
  # "queue_full"), not queued indefinitely.
  # max_queue_depth: 50
  # max_queue_depth_per_principal: 5

  # Real dialect-level cancellation of a RUNNING async query (TODO.md item 35
  # phase 3) — deny by default, the same posture as allow_cross_join above.
  # Cancelling an in-flight query needs a permission grant beyond what a
  # typical reporting connection has: Postgres requires this connection's
  # role to be a superuser or a member of pg_signal_backend
  # (GRANT pg_signal_backend TO <role>;); MSSQL requires the server-level
  # ALTER ANY CONNECTION permission or sysadmin. Only set this to true AFTER
  # granting the permission yourself — a cancel request for a running query
  # is rejected outright (403), before any DB call, while this is false.
  # Cancelling a still-QUEUED query is always free regardless of this flag
  # (it never touches the database).
  allow_query_cancellation: false

  # Per-principal rate/byte quota over a rolling window (TODO.md item 50).
  # Unset by default: no rate limiting. max_concurrency bounds queries
  # *in flight at once*; these bound how many (and how large a total
  # response) a single authenticated principal may run *over time*, so a
  # well-behaved caller that never exceeds its concurrency limit still can't
  # fire unbounded sequential queries and exhaust DB capacity or a cost
  # budget. Scoped per principal per connection; only enforced for an
  # authenticated caller (an anonymous request can't be rate-limited per
  # principal). A caller past either cap is refused before its query touches
  # the database — REST answers 429 with a Retry-After header; MCP returns a
  # RATE_LIMITED error. Set a tighter quota for a specific noisy agent under
  # `principals:` below. Enforcement is in-process (correct for a single
  # instance); a Redis-backed cross-replica quota is item 50 phase 2.
  # max_requests_per_window: 600
  # max_response_bytes_per_window: 104857600
  # quota_window_seconds: 60

  # Pre-execution cost estimation (Postgres only — see
  # execution/cost_estimation.py, TODO.md item 26). Unset by default: no
  # extra EXPLAIN round-trip, no behavior change. Uncomment to have
  # execute() plan (never run) the compiled query with Postgres's own
  # planner first and reject it before it touches real data if the
  # estimate is past either threshold. max_estimated_cost is in Postgres's
  # own arbitrary planner-cost units, not seconds — tune it against your
  # own schema/hardware rather than copying this number directly. Start
  # with cost_estimation_mode: observe to see what these thresholds would
  # reject (querygate_cost_estimation_would_reject_total) against real
  # traffic before switching to enforce.
  # max_estimated_rows: 1000000
  # max_estimated_cost: 100000
  # cost_estimation_mode: observe

connections:
  demo:
    # Only these tables are queryable at all — anything else is rejected
    # before compilation, even if it exists in the database. `employees` is
    # deliberately left out here: it's known to the connection (see
    # connections.example.yaml's known_tables) but contains HR/PII-shaped
    # columns (ssn, salary) that shouldn't be agent-reachable by default —
    # this is the realistic "wall off a sensitive table" scenario.
    allowed_tables: [customers, orders, order_items, products]

    # Column-level deny: email is queryable at the table level but this
    # specific column is never selectable/filterable/sortable, even though
    # the table itself is allowed.
    denied_columns:
      customers: [email]

    # Column value masking (item 49) — partial visibility of a column that is
    # otherwise permitted, applied inside the compiled query so the database
    # never returns the raw value. A masked column may ONLY appear as a bare
    # SELECT item; using it in a filter/join/order/group position (or nested in
    # a function/CASE/aggregate) is rejected, since an unmasked reference there
    # would leak the real value by inference. Keyed by table with "*" for all
    # tables, like allowed/denied_columns. Kinds: hash | null | last (needs
    # `length`) | bucket (needs `bucket_size`).
    column_masks:
      customers:
        - column: phone
          kind: last        # reveal only the last 4 chars, e.g. "***-6789"
          length: 4
        - column: national_id
          kind: hash        # deterministic one-way hash
      orders:
        - column: total_amount
          kind: bucket      # round down to the nearest 100
          bucket_size: 100

    max_limit: 200

    # Example mandatory row filter — always AND-ed into any query that
    # touches `orders`, e.g. for a policy that hides cancelled orders from
    # every agent by default. Empty by default in this example. A filter's
    # value can also be `from_claim: <name>` instead of a static `value`,
    # resolved from the authenticated principal's claims at query time
    # (e.g. a JWT's `tenant_id` claim) — the shape most multi-tenant
    # deployments need, since a static value is identical for every caller.
    mandatory_row_filters: []

    # Purpose-bound access (item 145, feature F7) — off by default (empty
    # list). Once populated, EVERY READ query on this connection must
    # declare a `purpose` from the list, or it's rejected before any DB
    # touch. Read-only: this gate does not extend to governed writes (item
    # 93) — a write statement has no `purpose` field and is unaffected by
    # this setting. A purpose can narrow the effective policy further via
    # `purpose_policies` — additional denied_tables/denied_columns/
    # mandatory_row_filters/column_masks unioned onto this policy's own;
    # there is no "allow" field, so a purpose can only take away access,
    # never grant more than this policy already does.
    # allowed_purposes: [fraud_review, customer_support]
    # purpose_policies:
    #   customer_support:
    #     denied_columns:
    #       customers: [ssn]

    # Optional k-anonymity guardrail (off by default). When set (floor 2), the
    # compiler injects `HAVING count(*) >= k` into every aggregate query, so a
    # caller can't single out an individual by aggregating over a razor-thin
    # filter — a group backed by fewer than k rows is suppressed, not returned.
    # Applies only to aggregate queries; closes single-query singling-out, not
    # multi-query differencing. See docs/INFERENCE_RISKS.md (R3).
    # The floor counts JOINED rows, so a join that can match many rows per row
    # would inflate it — such a join is refused on an aggregate query while this
    # is set (item 118). Joining onto a primary key or unique column is fine.
    # min_group_size: 5

  # ── retail: the broad operational view of the large demo domain ──────────
  # Everything except `staff` (the walled-off HR/PII table). PII-shaped
  # columns on `accounts` are masked rather than denied, so you can see the
  # "allow the table, reveal only a safe projection of the column" behavior:
  # `national_id` returns a one-way hash and `phone` returns only its last 4,
  # both computed inside the compiled query — the database never returns the
  # raw value to a retail caller.
  retail:
    allowed_tables:
      [regions, suppliers, accounts, catalog_products, orders_ext, order_lines, payments, web_events]
    column_masks:
      accounts:
        - column: national_id
          kind: hash
        - column: phone
          kind: last
          length: 4
    max_limit: 500

  # ── analytics: a deliberately TIGHTER reporting view of the same data ────
  # Same physical database as `retail`, different policy — this is the
  # "two callers of one dataset get different access" scenario. PII is denied
  # outright (not just masked), an aggregate k-anonymity floor suppresses any
  # group backed by fewer than 5 rows, the row cap is lower, and a mandatory
  # row filter silently scopes every query touching `accounts` to active
  # accounts only.
  analytics:
    allowed_tables: [regions, accounts, orders_ext, order_lines, web_events]
    denied_columns:
      accounts: [email, national_id, phone]
    min_group_size: 5
    max_limit: 100
    mandatory_row_filters:
      - table: accounts
        column: is_active
        value: true

# Per-principal overrides — optional, on top of the `default`/`connections`
# layers above. Uncomment and adapt once callers have distinct identities
# (a per-key `api_key_subject`, or JWT auth — see AppConfig's `jwt_*`
# fields and `core/jwt_auth.py`).
# principals:
#   agent-a:
#     demo:
#       # Required when default.enabled is false. This controls both direct
#       # access and whether REST/MCP connection discovery reveals `demo`.
#       enabled: true
#       # agent-a can't see email at all, on top of demo's own denied_columns.
#       denied_columns:
#         customers: [email]
#         orders: []
#   reporting-service:
#     "*":
#       # A read-only reporting caller gets a tighter row cap on every
#       # connection it can reach, without needing a connection-specific entry.
#       max_limit: 20
#   batch-agent:
#     "*":
#       # A noisy batch caller is throttled to 60 queries per minute on every
#       # connection it can reach, even if the connection default has no quota
#       # (TODO.md item 50). Per-principal overrides merge over the default, so
#       # this narrows just this one caller's rate.
#       max_requests_per_window: 60
#       quota_window_seconds: 60
