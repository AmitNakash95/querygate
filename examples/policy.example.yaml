# Example policy file for QueryGate.
#
# `default` applies to any connection with no entry under `connections`.
# Each entry under `connections` is merged on top of `default` (so you only
# need to specify what differs). Set POLICY_FILE to point at your
# own copy of this file.
#
# `principals` (optional) layers a further override on top of whichever of
# the above applies, keyed by the authenticated caller's Principal.subject —
# an API key's configured subject, or a JWT's subject claim. Without this,
# every caller of a connection gets identical access. Each principal entry
# is keyed by connection id, or "*" for every connection; a connection-
# specific entry wins over "*" for the same principal. See the `principals`
# block below.

default:
  # The runnable demo is permissive for quickstart convenience. For a
  # production deny-by-default posture, set this to false and explicitly set
  # enabled: true only for allowed principal/connection pairs below.
  enabled: true
  max_joins: 4
  max_select_columns: 20
  max_where_depth: 4
  max_group_by: 8
  max_limit: 100
  max_limit_aggregate: 1000
  default_limit: 50
  max_top_n: 50
  max_partition_by: 5
  max_batch_size: 10
  timeout_seconds: 30
  max_concurrency: 8
  concurrency_wait_seconds: 10

  # Queue-depth pressure controls (TODO.md item 35 phase 2). Unset by
  # default: no limit on how many callers may wait for a slot at once, same
  # as before this existed. max_concurrency bounds how many queries may
  # *run*; these bound how many may *wait* — without a cap, a burst of
  # queue_mode=wait callers against a saturated connection can itself become
  # a resource-exhaustion vector. Uncomment to bound it: a caller past
  # either cap is rejected immediately (queue_wait_ms: 0, admission_state
  # "queue_full"), not queued indefinitely.
  # max_queue_depth: 50
  # max_queue_depth_per_principal: 5

  # Pre-execution cost estimation (Postgres only — see
  # execution/cost_estimation.py, TODO.md item 26). Unset by default: no
  # extra EXPLAIN round-trip, no behavior change. Uncomment to have
  # execute() plan (never run) the compiled query with Postgres's own
  # planner first and reject it before it touches real data if the
  # estimate is past either threshold. max_estimated_cost is in Postgres's
  # own arbitrary planner-cost units, not seconds — tune it against your
  # own schema/hardware rather than copying this number directly. Start
  # with cost_estimation_mode: observe to see what these thresholds would
  # reject (querygate_cost_estimation_would_reject_total) against real
  # traffic before switching to enforce.
  # max_estimated_rows: 1000000
  # max_estimated_cost: 100000
  # cost_estimation_mode: observe

connections:
  demo:
    # Only these tables are queryable at all — anything else is rejected
    # before compilation, even if it exists in the database. `employees` is
    # deliberately left out here: it's known to the connection (see
    # connections.example.yaml's known_tables) but contains HR/PII-shaped
    # columns (ssn, salary) that shouldn't be agent-reachable by default —
    # this is the realistic "wall off a sensitive table" scenario.
    allowed_tables: [customers, orders, order_items, products]

    # Column-level deny: email is queryable at the table level but this
    # specific column is never selectable/filterable/sortable, even though
    # the table itself is allowed.
    denied_columns:
      customers: [email]

    max_limit: 200

    # Example mandatory row filter — always AND-ed into any query that
    # touches `orders`, e.g. for a policy that hides cancelled orders from
    # every agent by default. Empty by default in this example. A filter's
    # value can also be `from_claim: <name>` instead of a static `value`,
    # resolved from the authenticated principal's claims at query time
    # (e.g. a JWT's `tenant_id` claim) — the shape most multi-tenant
    # deployments need, since a static value is identical for every caller.
    mandatory_row_filters: []

# Per-principal overrides — optional, on top of the `default`/`connections`
# layers above. Uncomment and adapt once callers have distinct identities
# (a per-key `api_key_subject`, or JWT auth — see AppConfig's `jwt_*`
# fields and `core/jwt_auth.py`).
# principals:
#   agent-a:
#     demo:
#       # Required when default.enabled is false. This controls both direct
#       # access and whether REST/MCP connection discovery reveals `demo`.
#       enabled: true
#       # agent-a can't see email at all, on top of demo's own denied_columns.
#       denied_columns:
#         customers: [email]
#         orders: []
#   reporting-service:
#     "*":
#       # A read-only reporting caller gets a tighter row cap on every
#       # connection it can reach, without needing a connection-specific entry.
#       max_limit: 20
