# QueryGate local accounts (LOCAL_IDP_ENABLED=true, LOCAL_USERS_FILE=users.yaml).
#
# This file holds password VERIFIERS, never passwords: `password_verifier` is an
# scrypt output produced by QueryGate. There is no field anywhere that can hold
# a plaintext password. Treat the file as a credential file all the same —
# QueryGate writes it 0600 and preserves that mode.
#
# Do not hand-edit it while QueryGate is running. Every write goes through one
# locked writer (identity/local_store.LocalUserFileRepository); use the admin
# API instead:
#
#   POST   /api/v1/admin/identity/users               create an account
#   PATCH  /api/v1/admin/identity/users/{username}    groups, disable, password
#   POST   /api/v1/admin/identity/users/{username}/mfa   enrol TOTP (shown once)
#   DELETE /api/v1/admin/identity/users/{username}    delete + revoke sessions
#
# `groups` is what the identity.yaml mapping matches on, exactly the way it
# matches an Entra group GUID — the mapping layer has no local-provider case.

users:
  - username: breakglass
    display_name: "Break-glass operator"
    email: "ops@example.com"
    groups: ["break-glass"]
    # Generated by QueryGate; the real value is ~120 chars. Never reversible.
    password_verifier: "scrypt$65536$8$1$c2FsdHNhbHRzYWx0c2E=$aGFzaGhhc2hoYXNoaGFzaGhhc2hoYXNoaGE="
    # Present only when a second factor is enrolled. Written by the enrolment
    # endpoint and never readable back through the API.
    totp_secret: ""
    disabled: false
    # Forces a password change on next sign-in.
    must_change_password: true
