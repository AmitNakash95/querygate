{{/*
Only rendered when secrets.create is true — a quick-start convenience.
Production deployments should set secrets.existingSecretName instead and
manage the Secret with their own tooling (External Secrets Operator, Vault,
Sealed Secrets, ...); see values.yaml's comment on `secrets`.
*/}}
{{- if .Values.secrets.create }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "querygate.fullname" . }}
  labels:
    {{- include "querygate.labels" . | nindent 4 }}
type: Opaque
stringData:
  {{- toYaml .Values.secrets.env | nindent 2 }}
{{- end }}
