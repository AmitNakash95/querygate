apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "querygate.fullname" . }}
  labels:
    {{- include "querygate.labels" . | nindent 4 }}
spec:
  {{- if not .Values.autoscaling.enabled }}
  replicas: {{ .Values.replicaCount }}
  {{- end }}
  {{- with .Values.updateStrategy }}
  strategy:
    {{- toYaml . | nindent 4 }}
  {{- end }}
  selector:
    matchLabels:
      {{- include "querygate.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "querygate.selectorLabels" . | nindent 8 }}
      annotations:
        # Rolling the pods whenever the rendered config changes is what makes a
        # `helm upgrade` to connections/policy/catalog a zero-downtime, all-
        # replica config reload (item 5 + item 56): without this the ConfigMap
        # updates but running pods keep the stale mount. Combined with
        # updateStrategy (maxUnavailable: 0) below, the new config rolls out one
        # replica at a time behind the readiness gate, never dropping capacity.
        checksum/config: {{ include (print $.Template.BasePath "/configmap.yaml") . | sha256sum }}
        {{- with .Values.podAnnotations }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
    spec:
      serviceAccountName: {{ include "querygate.serviceAccountName" . }}
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      containers:
        - name: querygate
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          securityContext:
            {{- toYaml .Values.securityContext | nindent 12 }}
          ports:
            - name: http
              containerPort: 8000
              protocol: TCP
          env:
            {{- range $key, $value := .Values.env }}
            - name: {{ $key }}
              value: {{ $value | quote }}
            {{- end }}
            - name: CONNECTIONS_FILE
              value: /app/config/connections.yaml
            - name: POLICY_FILE
              value: /app/config/policy.yaml
            {{- if .Values.config.catalogYaml }}
            - name: CATALOG_FILE
              value: /app/config/catalog.yaml
            {{- end }}
            {{- if .Values.redis.enabled }}
            - name: CONCURRENCY_REDIS_URL
              value: {{ .Values.redis.url | quote }}
            {{- end }}
            {{- if .Values.configGovernance.enabled }}
            - name: CONFIG_GOVERNANCE_DIR
              value: /app/var/config_versions
            {{- end }}
          envFrom:
            - secretRef:
                name: {{ include "querygate.secretName" . }}
          livenessProbe:
            httpGet:
              path: {{ .Values.probes.liveness.path }}
              port: http
            initialDelaySeconds: {{ .Values.probes.liveness.initialDelaySeconds }}
            periodSeconds: {{ .Values.probes.liveness.periodSeconds }}
            timeoutSeconds: {{ .Values.probes.liveness.timeoutSeconds }}
            failureThreshold: {{ .Values.probes.liveness.failureThreshold }}
          readinessProbe:
            httpGet:
              path: {{ .Values.probes.readiness.path }}
              port: http
            initialDelaySeconds: {{ .Values.probes.readiness.initialDelaySeconds }}
            periodSeconds: {{ .Values.probes.readiness.periodSeconds }}
            timeoutSeconds: {{ .Values.probes.readiness.timeoutSeconds }}
            failureThreshold: {{ .Values.probes.readiness.failureThreshold }}
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          volumeMounts:
            - name: config
              mountPath: /app/config
              readOnly: true
            - name: audit
              mountPath: /app/var/audit
            {{- if .Values.configGovernance.enabled }}
            - name: config-governance
              mountPath: /app/var/config_versions
            {{- end }}
      volumes:
        - name: config
          configMap:
            name: {{ include "querygate.fullname" . }}-config
        - name: audit
          {{- if .Values.persistence.enabled }}
          persistentVolumeClaim:
            claimName: {{ include "querygate.fullname" . }}-audit
          {{- else }}
          emptyDir: {}
          {{- end }}
        {{- if .Values.configGovernance.enabled }}
        - name: config-governance
          persistentVolumeClaim:
            claimName: {{ include "querygate.fullname" . }}-config-governance
        {{- end }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.topologySpreadConstraints }}
      topologySpreadConstraints:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
