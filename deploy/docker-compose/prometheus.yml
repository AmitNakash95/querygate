# Example Prometheus scrape config for QueryGate's /metrics endpoint
# (querygate/metrics.py). /metrics requires the admin:metrics:read scope by
# default (AppConfig.metrics_require_auth, docs/THREAT_MODEL.md QG-36), so
# this scrape carries a bearer token — see .env.production.example's
# API_KEY_SCOPES comment for how to grant it. Restrict network access to
# this port at the proxy/firewall layer regardless — see docs/THREAT_MODEL.md's
# deployment requirements ("Restrict /health and admin routes...").
#
# Used automatically by the bundled `prometheus` service in
# docker-compose.prod.yml (--profile monitoring); copy the scrape_configs
# block into your own Prometheus if you run it centrally instead.

global:
  scrape_interval: 15s

scrape_configs:
  - job_name: querygate
    metrics_path: /metrics
    authorization:
      credentials_file: /etc/prometheus/querygate-metrics-token
    static_configs:
      - targets: ["querygate:8000"]
