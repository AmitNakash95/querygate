# Policy used only by scripts/release_smoke.sh to exercise a real governed WRITE
# (and its undo) against the shipped image. Reads stay permissive (as the demo
# example is); writes are enabled on `orders` with a small cap and bounded
# reversibility so the smoke can insert -> verify -> undo -> verify. Not a
# shipped default — the product stays deny-by-default for writes.
default:
  enabled: true
  write:
    enabled: true
    allowed_tables: ["orders"]
    allowed_operations: ["insert", "update", "delete"]
    max_affected_rows: 100
    compensation_enabled: true
    max_compensation_rows: 100
