name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    name: Format check + full test suite
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Poetry
        run: pipx install poetry==2.4.1

      - name: Cache Poetry virtualenv
        uses: actions/cache@v4
        with:
          path: .venv
          key: poetry-${{ runner.os }}-${{ hashFiles('poetry.lock') }}

      - name: Install dependencies
        run: poetry install --no-interaction

      - name: black --check
        run: poetry run black --check src/ tests/ examples/

      # Full suite (unit + integration) never needs a real database or
      # docker — see CLAUDE.md's "Testing gotchas" — except
      # tests/integration/test_sqlite_end_to_end.py, which uses a real
      # in-memory SQLite engine and needs nothing external either.
      - name: pytest
        run: poetry run pytest --cov=src --cov-report=term-missing

      - name: querygate-validate-config (example configs)
        run: poetry run querygate-validate-config --connections-file examples/connections.example.yaml --policy-file examples/policy.example.yaml
        env:
          QUERYGATE_DEMO_DB_URL: postgresql+asyncpg://user:pass@localhost/demo

  postgres-live:
    name: Real-Postgres tests (query timeout cancellation)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:15.1
        env:
          POSTGRES_USER: querygate
          POSTGRES_PASSWORD: querygate
          POSTGRES_DB: querygate_demo
        ports:
          - 5433:5432
        options: >-
          --health-cmd "pg_isready -U querygate -d querygate_demo"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Poetry
        run: pipx install poetry==2.4.1

      - name: Install dependencies
        run: poetry install --no-interaction

      - name: pytest -m postgres_live
        run: poetry run pytest -m postgres_live

  mssql-live:
    name: Real-MSSQL tests (TODO.md item 2)
    runs-on: ubuntu-latest
    services:
      mssql:
        image: mcr.microsoft.com/mssql/server:2022-latest
        env:
          ACCEPT_EULA: "Y"
          MSSQL_SA_PASSWORD: "QueryGate_Test_Pw1!" # dev-only, matches setup_mssql_test_db.py's default
          MSSQL_PID: Developer
        ports:
          - 1433:1433
        options: >-
          --health-cmd "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P QueryGate_Test_Pw1! -C -Q 'SELECT 1'"
          --health-interval 10s
          --health-timeout 10s
          --health-retries 10
    env:
      QUERYGATE_TEST_MSSQL_HOST: localhost
      QUERYGATE_TEST_MSSQL_PORT: "1433"
      QUERYGATE_TEST_MSSQL_SA_PASSWORD: "QueryGate_Test_Pw1!"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Poetry
        run: pipx install poetry==2.4.1

      # ODBC Driver 18 for SQL Server — client-side requirement for
      # pyodbc/aioodbc, separate from the MSSQL *server* service container
      # above. Mirrors the exact steps in Dockerfile's production stage
      # (fixed as part of TODO.md item 14 after this same key-format issue
      # broke that build); the Ubuntu version in the packages.microsoft.com
      # URL may need bumping if this starts failing after a runner image
      # update — see Dockerfile's comment for the underlying upstream issue.
      - name: Install unixODBC + msodbcsql18
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends unixodbc unixodbc-dev gnupg curl
          curl -sSL https://packages.microsoft.com/keys/microsoft.asc | sudo gpg --dearmor -o /usr/share/keyrings/microsoft-prod.gpg
          curl -sSL https://packages.microsoft.com/config/ubuntu/22.04/prod.list | sudo tee /etc/apt/sources.list.d/mssql-release.list
          sudo apt-get update
          sudo ACCEPT_EULA=Y apt-get install -y --no-install-recommends msodbcsql18

      - name: Install dependencies
        run: poetry install --no-interaction

      - name: Set up MSSQL test databases
        run: poetry run python tests/integration/setup_mssql_test_db.py

      - name: pytest -m mssql_live
        run: poetry run pytest -m mssql_live

  docker:
    name: Docker build + smoke test
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4

      - name: Build image
        run: docker build -t querygate:ci .

      - name: Run container
        run: |
          docker run -d --name querygate-ci -p 8000:8000 \
            -e ENVIRONMENT=localhost \
            -e CONNECTIONS_FILE=examples/connections.example.yaml \
            -e POLICY_FILE=examples/policy.example.yaml \
            -e QUERYGATE_DEMO_DB_URL="postgresql+asyncpg://user:pass@localhost/demo" \
            querygate:ci
          for i in $(seq 1 20); do
            if curl -sf http://localhost:8000/health; then break; fi
            sleep 1
          done

      - name: Smoke test /health
        run: curl -sf http://localhost:8000/health

      - name: Smoke test /api/v1/connections
        run: curl -sf http://localhost:8000/api/v1/connections

      - name: Container logs (on failure)
        if: failure()
        run: docker logs querygate-ci

      - name: Stop container
        if: always()
        run: docker rm -f querygate-ci || true
