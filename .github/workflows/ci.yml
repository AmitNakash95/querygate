name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    name: Format check + full test suite
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Poetry
        run: pipx install poetry==2.4.1

      - name: Cache Poetry virtualenv
        uses: actions/cache@v4
        with:
          path: .venv
          key: poetry-${{ runner.os }}-${{ hashFiles('poetry.lock') }}

      - name: Install dependencies
        run: poetry install --no-interaction

      # The BSL Change Date is arithmetic on a legal document, and a wrong one
      # is invisible on inspection. Gate it on every push, not only at release.
      - name: BSL Change Date gate
        run: make change-date-check

      - name: black --check
        # Call the Makefile target rather than re-listing the paths, so the
        # formatter's scope has exactly one definition (it gained `scripts/`
        # when the licence gate landed there, and this copy silently didn't).
        run: make format-check

      # Full suite (unit + integration) never needs a real database or
      # docker — see CLAUDE.md's "Testing gotchas" — except
      # tests/integration/test_sqlite_end_to_end.py, which uses a real
      # in-memory SQLite engine and needs nothing external either.
      - name: pytest
        run: poetry run pytest --cov=src --cov-report=term-missing

      - name: querygate-validate-config (example configs)
        run: poetry run querygate-validate-config --connections-file examples/connections.example.yaml --policy-file examples/policy.example.yaml
        env:
          QUERYGATE_DEMO_DB_URL: postgresql+asyncpg://user:pass@localhost/demo

      - name: Release metadata and package build
        run: |
          poetry check --lock
          poetry run python scripts/check_release.py
          poetry build
          poetry run python scripts/check_release_artifacts.py

      # SBOM + dependency vulnerability audit (TODO.md item 30 phase 1), scoped
      # to poetry.lock's `main` group — the exact locked set QueryGate ships,
      # not whatever a fresh unpinned resolve would pick. Fails on any known
      # vulnerability without a reviewed entry in
      # security/dependency-audit-allowlist.json (deny-by-default); needs
      # network access to query the vulnerability database, same as
      # `poetry install` above.
      - name: Generate SBOM and audit locked dependencies
        run: poetry run python scripts/generate_sbom.py

      - name: Validate deploy/ reference stacks (TODO.md item 29)
        run: |
          cp deploy/docker-compose/.env.production.example deploy/docker-compose/.env.production
          docker compose -f deploy/docker-compose/docker-compose.prod.yml \
            --env-file deploy/docker-compose/.env.production config --quiet
          rm deploy/docker-compose/.env.production

      - uses: azure/setup-helm@v4
        with:
          version: "v3.16.1"

      - name: helm lint + template deploy/helm/querygate (every optional feature enabled)
        run: |
          helm lint deploy/helm/querygate
          helm template test deploy/helm/querygate \
            --set autoscaling.enabled=true \
            --set podDisruptionBudget.enabled=true \
            --set metrics.serviceMonitor.enabled=true \
            --set persistence.enabled=true \
            --set secrets.create=true \
            --set secrets.env.API_KEYS='["k"]' \
            > /dev/null

  postgres-live:
    name: Real-Postgres tests (correctness, security, guardrails, soak)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:15.1
        env:
          POSTGRES_USER: querygate
          POSTGRES_PASSWORD: querygate
          POSTGRES_DB: querygate_demo
        ports:
          - 5433:5432
        options: >-
          --health-cmd "pg_isready -U querygate -d querygate_demo"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Poetry
        run: pipx install poetry==2.4.1

      - name: Install dependencies
        run: poetry install --no-interaction

      # GitHub's `services.postgres` is a bare image — unlike `docker compose
      # up` it can't mount examples/demo_db/init_postgres.sql into the initdb
      # hook, so nothing seeds the demo schema. Do it explicitly here (the
      # Postgres analogue of the mssql-live job's setup_mssql_test_db.py step):
      #   * querygate_demo  <- the canonical 5-table demo schema the
      #     array_agg/percentile/cost/schema-discovery tests reflect and query.
      #   * querygate_stress <- an empty database the large-domain stress suite
      #     seeds itself (drop+recreate, session-scoped). It MUST be separate
      #     from querygate_demo: the stress suite leaves ~8 tables behind and
      #     test_postgres_schema_discovery asserts querygate_demo holds exactly
      #     the five demo tables, so one shared DB makes them mutually exclusive.
      - name: Seed demo schema (querygate_demo) + create stress DB (querygate_stress)
        env:
          PGPASSWORD: querygate
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends postgresql-client
          psql -h localhost -p 5433 -U querygate -d querygate_demo \
            -v ON_ERROR_STOP=1 -f examples/demo_db/init_postgres.sql
          psql -h localhost -p 5433 -U querygate -d querygate_demo \
            -v ON_ERROR_STOP=1 -c 'CREATE DATABASE querygate_stress OWNER querygate;'

      # Every postgres_live test EXCEPT the `load`-marked concurrency/soak
      # ones, run first because they're fast and timing-insensitive. This
      # includes the large-domain stress suite's differential-correctness,
      # security-at-volume, and log/audit no-leak checks
      # (tests/integration/test_large_domain_stress.py), which self-seed their
      # own data and so need nothing beyond the bare Postgres service above.
      # Exclude tests that ALSO need MSSQL (the cross-dialect differential
      # suite) — they can't pass in a Postgres-only job and run in the dedicated
      # `cross-dialect-differential` job that provides both databases.
      - name: pytest -m "postgres_live and not mssql_live and not load"
        run: poetry run pytest -m "postgres_live and not mssql_live and not load"

      # The concurrency-guardrail (pg_sleep probes) + heavy-burst + soak tests.
      # Kept as a separate, named step so a timing-related failure is obvious.
      # A few soak rounds is plenty to catch a pool leak or a cap breach on CI
      # without making the job slow; bump QUERYGATE_LOAD_ROUNDS for a heavier
      # local/scheduled run.
      - name: pytest -m "postgres_live and load" (guardrails + burst + soak)
        run: poetry run pytest -m "postgres_live and load"
        env:
          QUERYGATE_LOAD_ROUNDS: "5"

  mssql-live:
    name: Real-MSSQL tests (TODO.md item 2)
    runs-on: ubuntu-latest
    services:
      mssql:
        image: mcr.microsoft.com/mssql/server:2022-latest
        env:
          ACCEPT_EULA: "Y"
          MSSQL_SA_PASSWORD: "QueryGate_Test_Pw1!" # dev-only, matches setup_mssql_test_db.py's default
          # Non-UTC on purpose (TODO.md item 102): MSSQL's UTC guarantee is the
          # choice of SYSUTCDATETIME() over GETDATE(), which a UTC-clocked server
          # cannot distinguish. Without this the clock assertion passes vacuously.
          TZ: "Pacific/Marquesas"
          MSSQL_PID: Developer
        ports:
          - 1433:1433
        options: >-
          --health-cmd "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P QueryGate_Test_Pw1! -C -Q 'SELECT 1'"
          --health-interval 10s
          --health-timeout 10s
          --health-retries 10
    env:
      QUERYGATE_TEST_MSSQL_HOST: localhost
      QUERYGATE_TEST_MSSQL_PORT: "1433"
      QUERYGATE_TEST_MSSQL_SA_PASSWORD: "QueryGate_Test_Pw1!"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Poetry
        run: pipx install poetry==2.4.1

      # ODBC Driver 18 for SQL Server — client-side requirement for
      # pyodbc/aioodbc, separate from the MSSQL *server* service container
      # above. The Microsoft repo is release-specific, so we derive the
      # runner's actual Ubuntu version instead of hardcoding it: ubuntu-latest
      # moved 22.04 -> 24.04, and the old jammy prod.list both (a) lacks the
      # `signed-by=` keyring attribute that 24.04's stricter apt now requires
      # and (b) pulls jammy libodbc dependencies that conflict on noble — so a
      # pinned 22.04 URL fails the install outright on the current runner.
      # Detecting VERSION_ID keeps this correct across future runner bumps.
      - name: Install unixODBC + msodbcsql18
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends unixodbc unixodbc-dev gnupg curl
          # Run gpg as the runner user (NOT under sudo) and sudo only the file
          # write: `sudo gpg --dearmor` inherits the runner's gpg-agent/GPG_TTY
          # environment and dies with "gpg: cannot open '/dev/tty'" on the
          # 24.04 runner. Piping to `sudo tee` sidesteps that and writes the
          # same binary keyring the prod.list's signed-by= expects.
          curl -sSL https://packages.microsoft.com/keys/microsoft.asc | gpg --dearmor | sudo tee /usr/share/keyrings/microsoft-prod.gpg > /dev/null
          ubuntu_ver="$(. /etc/os-release && echo "$VERSION_ID")"
          curl -sSL "https://packages.microsoft.com/config/ubuntu/${ubuntu_ver}/prod.list" | sudo tee /etc/apt/sources.list.d/mssql-release.list
          sudo apt-get update
          sudo ACCEPT_EULA=Y apt-get install -y --no-install-recommends msodbcsql18

      - name: Install dependencies
        run: poetry install --no-interaction

      - name: Set up MSSQL test databases
        run: poetry run python tests/integration/setup_mssql_test_db.py

      # Exclude tests that ALSO need Postgres (the cross-dialect differential
      # suite) — they can't pass in an MSSQL-only job and run in the dedicated
      # `cross-dialect-differential` job that provides both databases.
      - name: pytest -m "mssql_live and not postgres_live"
        run: poetry run pytest -m "mssql_live and not postgres_live"

  mysql-live:
    name: Real-MySQL tests (TODO.md item 19)
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: "QueryGate_Test_Pw1" # dev-only, matches setup_mysql_test_db.py's default
          MYSQL_DATABASE: querygate_demo
        ports:
          - 3306:3306
        options: >-
          --health-cmd "mysqladmin ping -h 127.0.0.1 -uroot -pQueryGate_Test_Pw1"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    env:
      QUERYGATE_TEST_MYSQL_HOST: localhost
      QUERYGATE_TEST_MYSQL_PORT: "3306"
      QUERYGATE_TEST_MYSQL_ROOT_PASSWORD: "QueryGate_Test_Pw1"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Poetry
        run: pipx install poetry==2.4.1

      # Unlike MSSQL, asyncmy needs no system-level client driver install —
      # it's a pure pip dependency, so this job is a plain service-container
      # job with no apt step.
      - name: Install dependencies
        run: poetry install --no-interaction

      - name: Set up MySQL test database
        run: poetry run python tests/integration/setup_mysql_test_db.py

      - name: pytest -m mysql_live
        run: poetry run pytest -m mysql_live

  cross-dialect-differential:
    name: Cross-dialect differential tests (Postgres + MSSQL)
    runs-on: ubuntu-latest
    # The item-36 differential suite executes the SAME StructuredQuery against a
    # live Postgres AND a live MSSQL and asserts the returned rows are identical.
    # It needs BOTH databases in one job (the single-DB jobs above deliberately
    # exclude it), so this job stands up both service containers, seeds each with
    # the same demo data, and runs only the dual-marked tests.
    services:
      postgres:
        image: postgres:15.1
        env:
          POSTGRES_USER: querygate
          POSTGRES_PASSWORD: querygate
          POSTGRES_DB: querygate_demo
        ports:
          - 5433:5432
        options: >-
          --health-cmd "pg_isready -U querygate -d querygate_demo"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      mssql:
        image: mcr.microsoft.com/mssql/server:2022-latest
        env:
          ACCEPT_EULA: "Y"
          MSSQL_SA_PASSWORD: "QueryGate_Test_Pw1!" # dev-only, matches setup_mssql_test_db.py's default
          # Non-UTC on purpose (TODO.md item 102): MSSQL's UTC guarantee is the
          # choice of SYSUTCDATETIME() over GETDATE(), which a UTC-clocked server
          # cannot distinguish. Without this the clock assertion passes vacuously.
          TZ: "Pacific/Marquesas"
          MSSQL_PID: Developer
        ports:
          - 1433:1433
        options: >-
          --health-cmd "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P QueryGate_Test_Pw1! -C -Q 'SELECT 1'"
          --health-interval 10s
          --health-timeout 10s
          --health-retries 10
    env:
      QUERYGATE_TEST_MSSQL_HOST: localhost
      QUERYGATE_TEST_MSSQL_PORT: "1433"
      QUERYGATE_TEST_MSSQL_SA_PASSWORD: "QueryGate_Test_Pw1!"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Poetry
        run: pipx install poetry==2.4.1

      # ODBC Driver 18 for SQL Server — same client-side requirement as the
      # mssql-live job (see its notes on deriving the runner's Ubuntu version).
      - name: Install unixODBC + msodbcsql18
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends unixodbc unixodbc-dev gnupg curl
          curl -sSL https://packages.microsoft.com/keys/microsoft.asc | gpg --dearmor | sudo tee /usr/share/keyrings/microsoft-prod.gpg > /dev/null
          ubuntu_ver="$(. /etc/os-release && echo "$VERSION_ID")"
          curl -sSL "https://packages.microsoft.com/config/ubuntu/${ubuntu_ver}/prod.list" | sudo tee /etc/apt/sources.list.d/mssql-release.list
          sudo apt-get update
          sudo ACCEPT_EULA=Y apt-get install -y --no-install-recommends msodbcsql18

      - name: Install dependencies
        run: poetry install --no-interaction

      # Seed Postgres with the canonical demo schema (same source the MSSQL setup
      # below uses via examples/demo_db/schema.py), so the two databases hold
      # identical rows and the differential comparison is meaningful.
      - name: Seed demo schema into Postgres (querygate_demo)
        env:
          PGPASSWORD: querygate
        run: |
          sudo apt-get install -y --no-install-recommends postgresql-client
          psql -h localhost -p 5433 -U querygate -d querygate_demo \
            -v ON_ERROR_STOP=1 -f examples/demo_db/init_postgres.sql

      - name: Set up MSSQL test databases
        run: poetry run python tests/integration/setup_mssql_test_db.py

      - name: pytest -m "postgres_live and mssql_live"
        run: poetry run pytest -m "postgres_live and mssql_live"

  typescript-client:
    name: TypeScript client builder (item 51 phase 2a)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: clients/typescript/package-lock.json

      - name: npm ci
        working-directory: clients/typescript
        run: npm ci

      # Includes the cross-language kitchen-sink parity fixture shared with
      # tests/unit/test_client_builder_ts_parity.py (the Python-side pytest job
      # above runs that half automatically; this job is the TS-side half).
      - name: Build + test (tsc + node --test)
        working-directory: clients/typescript
        run: npm test

  docker:
    name: Docker + real-Postgres release smoke
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4

      - name: Build image and execute a structured query against Postgres
        run: make release-smoke

      # Container vulnerability + secret + misconfig scan of the exact image we
      # ship (built above by release-smoke as querygate:release-smoke). Fails on
      # any HIGH/CRITICAL that isn't a reviewed exception in .trivyignore
      # (deny-by-default, same posture as the pip-audit dependency gate).
      # `--ignore-unfixed` keeps the gate actionable: it fails only on CVEs that
      # actually have a fix we could pull in. See TODO.md item 89.
      - name: Trivy scan of the shipped image
        uses: aquasecurity/trivy-action@v0.24.0
        with:
          image-ref: querygate:release-smoke
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"
          trivyignores: .trivyignore
          scanners: vuln,secret,misconfig

  secret-scan:
    name: Secret scan (gitleaks, full history)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # gitleaks needs the whole history to prove no credential was ever
          # committed, not just the tip tree.
          fetch-depth: 0

      # Run gitleaks from its official image (license-free for a single repo,
      # unlike the org-oriented gitleaks-action). Allowlist of reviewed dev-only
      # placeholders lives in .gitleaks.toml; deny-by-default otherwise.
      - name: gitleaks detect
        run: |
          docker run --rm -v "${{ github.workspace }}:/repo" \
            zricethezav/gitleaks:latest \
            detect --source /repo --config /repo/.gitleaks.toml \
            --redact --verbose --exit-code 1

  sast:
    name: SAST (Bandit + Semgrep OSS)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Poetry
        run: pipx install poetry==2.4.1

      - name: Install dependencies
        run: poetry install --no-interaction

      # Python security linter over the product source (config in
      # pyproject.toml [tool.bandit]). Accepted findings are annotated inline
      # with `# nosec: <reason>`, never blanket-suppressed.
      - name: Bandit
        run: poetry run bandit -c pyproject.toml -r src/

      # Semgrep OSS with community security rulesets — free and private-repo
      # friendly (CodeQL is the paid GitHub Advanced Security upgrade). No login
      # or token required for the public `p/...` rule packs.
      - name: Semgrep OSS
        run: |
          pipx install semgrep
          semgrep --error --disable-version-check \
            --config p/python \
            --config p/security-audit \
            --config p/owasp-top-ten \
            src/

  dast:
    name: DAST (Schemathesis OpenAPI fuzzing)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Poetry
        run: pipx install poetry==2.4.1

      - name: Install dependencies
        run: poetry install --no-interaction

      # Property-based fuzzing of every REST endpoint against the live OpenAPI
      # schema — the machine-checkable proof of QueryGate's core guarantee: the
      # only accepted input is a validated StructuredQuery AST; malformed or
      # adversarial payloads are rejected (4xx), never a 5xx and never executed.
      - name: Schemathesis DAST
        run: make test-dast
