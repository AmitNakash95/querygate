name: Release

# Publish the production container image when a version tag is pushed.
#
#   git tag -a v0.1.0 -m "QueryGate v0.1.0"
#   git push origin v0.1.0
#
# This is the CD half that docs/RELEASING.md's "Tagging" section and TODO.md
# item 30 phase 2 describe as deferred: `make release-check` / `make
# release-smoke` prove the release locally, the normal CI on `main` already
# tests + Trivy-scans the image, and *this* workflow is what actually pushes a
# signed, versioned image to the registry so a customer can pull it.
#
# The image is built from the same production Dockerfile CI already uses. It is
# scanned with Trivy BEFORE it is pushed (deny-by-default, same posture as the
# `docker` job in ci.yml), then pushed to GHCR and signed with cosign keyless
# (Sigstore) using the workflow's OIDC identity — no long-lived signing key to
# manage.
on:
  push:
    tags:
      - "v*"

# Least privilege at the top level; the single job that publishes elevates
# only what it needs (see `publish.permissions` below). Scorecard's
# Token-Permissions check penalises workflow-level write scopes even when only
# one job uses them.
permissions:
  contents: read

env:
  # GHCR path is derived from the repo automatically and lowercased by
  # docker/metadata-action. For AGitmit/QueryGate this resolves to
  # ghcr.io/amitnakash95/querygate.
  # LOWERCASED at use time. An OCI reference must be lowercase, and
  # `github.repository` preserves the owner's capitalisation
  # (`AmitNakash95/querygate`). The push succeeded anyway because
  # docker/metadata-action lowercases what it emits, which HID the problem:
  # `cosign sign` then received the RAW value and failed with "could not parse
  # reference" AFTER the image was already published. Measured on v0.2.0; a
  # lowercase owner would never have hit this.
  IMAGE_RAW: ghcr.io/${{ github.repository }}

jobs:
  publish:
    name: Build, scan, push, and sign the release image
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write # push to GHCR
      id-token: write # cosign keyless signing via OIDC
      attestations: write # SLSA build-provenance attestation
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # An OCI reference must be lowercase; `github.repository` keeps the owner's
      # capitalisation. Computed once here so every consumer — metadata-action,
      # cosign, and the provenance attestation — uses the same lowercased value.
      - name: Lowercase the image reference
        run: |
          echo "IMAGE=$(printf '%s' "$IMAGE_RAW" | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_ENV"

      # Fail fast if the tag (e.g. v0.1.0) doesn't match the version baked into
      # the package/pyproject. scripts/check_release.py already asserts
      # pyproject and __init__ agree; here we assert the tag agrees with them
      # too, so a published image can never be mislabelled.
      - name: Verify tag matches package version
        run: |
          tag="${GITHUB_REF_NAME#v}"
          pkg="$(grep -m1 '^version' pyproject.toml | sed -E 's/.*"([^"]+)".*/\1/')"
          echo "tag=$tag package=$pkg"
          if [ "$tag" != "$pkg" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match pyproject version $pkg"
            exit 1
          fi

      # The licence gate, before anything is built or published. `LICENSE` is a
      # The EULA is the licence of record for the proprietary subscription
      # (item 210). Without this, pushing a tag would publish a signed image
      # whose licence still reads "[LICENSOR LEGAL NAME]" / "[ADDRESS]".
      # Release mode refuses any unfilled placeholder, in either language --
      # EULA.he.md's placeholders are Hebrew, so an ASCII-only pattern misses them.
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"

      - uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0

      # Compute the image tags + OCI labels from the git tag.
      #   ghcr.io/amitnakash95/querygate:0.2.0   (exact version)
      #   ghcr.io/amitnakash95/querygate:latest  (only on a non-prerelease tag)
      - name: Compute image tags and labels
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=semver,pattern={{version}}
            type=raw,value=latest,enable=${{ !contains(github.ref_name, '-') }}

      # Build once into the local docker daemon so we can scan the exact bytes
      # before anything is published. Cached to GHA so the push step below is a
      # near-instant re-tag, not a rebuild.
      - name: Build image (local, for scanning)
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          load: true
          tags: querygate:release-candidate
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Same gate as ci.yml's `docker` job: fail on any fixable HIGH/CRITICAL
      # vuln, leaked secret, or misconfig that isn't a reviewed exception in
      # .trivyignore. A failure here stops the release before publishing.
      - name: Trivy scan (pre-publish gate)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: querygate:release-candidate
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"
          trivyignores: .trivyignore
          scanners: vuln,secret,misconfig

      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Re-tag + push using the cache from the build above (no rebuild). Outputs
      # the registry digest so we sign by immutable digest, not by tag.
      - name: Push image to GHCR
        id: push
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha

      - name: Install cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      # Keyless signature (Sigstore) bound to this workflow's OIDC identity and
      # recorded in the public transparency log. A customer can later verify the
      # image really came from this repo's release workflow with:
      #   cosign verify ghcr.io/amitnakash95/querygate:0.2.0 \
      #     --certificate-identity-regexp 'https://github.com/AGitmit/QueryGate/.github/workflows/release.yml@.*' \
      #     --certificate-oidc-issuer https://token.actions.githubusercontent.com
      - name: Sign the image with cosign (keyless)
        env:
          DIGEST: ${{ steps.push.outputs.digest }}
        run: cosign sign --yes "${IMAGE}@${DIGEST}"

      # Signed, verifiable SLSA build provenance for the pushed image: an in-toto
      # attestation, bound to this workflow's OIDC identity via Sigstore and
      # recorded in the transparency log, that states which repo/workflow/commit
      # built these exact bytes. Pushed to GHCR next to the image and also stored
      # in GitHub's attestations API. This is the "SLSA provenance" half of the
      # signed-delivery gate (the cosign step above is the signing half). A
      # consumer verifies it by immutable digest with:
      #   gh attestation verify oci://ghcr.io/amitnakash95/querygate@<digest> \
      #     --repo AGitmit/QueryGate
      - name: Attest SLSA build provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ${{ env.IMAGE }}
          subject-digest: ${{ steps.push.outputs.digest }}
          push-to-registry: true
