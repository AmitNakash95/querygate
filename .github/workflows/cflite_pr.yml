# ClusterFuzzLite — coverage-guided fuzzing of the AST boundary on every PR.
#
# This is the continuous complement to tests/security/test_malformed_input_fuzzing.py:
# that file sweeps a hand-written corpus of malformed shapes, this finds the
# ones nobody thought to write down. See fuzz/fuzz_structured_query.py for what
# counts as a finding and why RecursionError is treated as one.
#
# 10 minutes per PR is a deliberate ceiling: long enough to catch a regression
# introduced by the diff, short enough not to gate review. Deep campaigns
# belong in a scheduled batch run, not here.
name: ClusterFuzzLite (PR)

on:
  pull_request:
    paths:
      - "src/querygate/query_ast/**"
      - "src/querygate/write_ast/**"
      - "src/querygate/validation/**"
      - "fuzz/**"
      - ".clusterfuzzlite/**"
      - ".github/workflows/cflite_pr.yml"

permissions:
  contents: read

jobs:
  fuzz:
    name: Fuzz the AST boundary
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        sanitizer: [address, undefined]
    steps:
      - name: Build fuzzers (${{ matrix.sanitizer }})
        uses: google/clusterfuzzlite/actions/build_fuzzers@884713a6c30a92e5e8544c39945cd7cb630abcd1 # v1
        with:
          language: python
          sanitizer: ${{ matrix.sanitizer }}
          # Build against the PR's merge commit so a finding is attributable to
          # the diff under review rather than to main.
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Run fuzzers (${{ matrix.sanitizer }})
        uses: google/clusterfuzzlite/actions/run_fuzzers@884713a6c30a92e5e8544c39945cd7cb630abcd1 # v1
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          fuzz-seconds: 600
          mode: code-change
          sanitizer: ${{ matrix.sanitizer }}
          output-sarif: true
