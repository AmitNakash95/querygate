[tool.black]
line-length = 100

[project]
name = "querygate"
version = "0.1.0"
description = "Agent-safe database access gateway — expose databases to AI agents over MCP and REST without raw SQL."
authors = [{ name = "Amit Nakash" }]
readme = "README.md"
requires-python = ">=3.11,<4.0"
dynamic = ["dependencies"]

[project.scripts]
querygate = "querygate.run:main"
querygate-validate-config = "querygate.cli:main"
querygate-semantic-memory = "querygate.catalog_cli:main"
querygate-audit = "querygate.audit_cli:main"
querygate-security-benchmark = "querygate.security_benchmark_cli:main"
querygate-performance-benchmark = "querygate.performance_benchmark_cli:main"
querygate-load-benchmark = "querygate.load_benchmark_cli:main"
querygate-scope-catalog = "querygate.scope_catalog_cli:main"
querygate-config = "querygate.config_cli:main"
querygate-quickstart = "querygate.quickstart_cli:main"

[project.urls]
Repository = "https://github.com/AGitmit/QueryGate"
Documentation = "https://github.com/AGitmit/QueryGate#readme"

[tool.poetry]
packages = [
    { include = "querygate", from = "src" },
    { include = "examples" },
]

[tool.poetry.dependencies]
python = "^3.11"
# pydantic ecosystem relaxed from exact pins to floors so the security-driven
# fastapi/mcp bumps below (TODO item 30 phase 2) can resolve a compatible set.
pydantic = ">=2.11.5"
pydantic-settings = ">=2.9.1"
pydantic-core = ">=2.33.2"
SQLAlchemy = "2.0.41"
greenlet = "3.0.3"
pyodbc = "^5.2.0"
aioodbc = "0.5.0"
uvicorn = ">=0.29.0"
# fastapi >=0.119 supports Starlette 1.x; required to pull the CVE-fixed
# starlette >=1.3.1 (TODO item 30 phase 2 dependency remediation).
fastapi = ">=0.119.0"
starlette = ">=1.3.1"
python-dotenv = ">=1.2.2"
asyncpg = "^0.30.0"
# mcp >=2.0.0 (TODO item 128): the `2026-07-28` protocol revision, `MCPServer`
# (formerly `FastMCP`) SDK. Also carries forward the CVE-2025-66416 /
# CVE-2026-52869 / CVE-2026-59950 fixes from the 1.28.1 floor it replaces.
mcp = ">=2.0.0"
httpx = "^0.28.1"
loguru = "^0.7.3"
PyYAML = "^6.0"
prometheus-client = "^0.25.0"
pyjwt = {extras = ["crypto"], version = "^2.13.0"}
# Direct dependency (TODO item 47 phase 2): encrypted-at-rest config draft
# store (admin/draft_store.py) uses Fernet directly. Previously only reached
# transitively via pyjwt[crypto] — declared explicitly so a future pyjwt
# change can't silently drop it out from under a production import.
cryptography = ">=44.0.1"
redis = "^8.0.1"
hvac = "^2.4.0"
defusedxml = "^0.7.1"
asyncmy = "^0.2.11"
boto3 = "^1.43.65"

[tool.poetry.group.dev.dependencies]
# Test stack floored at CVE-fixed versions (pytest PYSEC-2026-1845); pytest 9
# needs pytest-asyncio 1.x / pytest-mock 3.14+ / pytest-cov 6.1+.
pytest = ">=9.0.3"
pytest-asyncio = ">=1.0.0"
pytest-mock = ">=3.14.0"
black = ">=26.3.1"
fakeredis = "^2.36.2"
lupa = "^2.8"
pytest-cov = ">=6.1.0"
cyclonedx-bom = "^7.3.0"
pip-audit = "^2.10.1"
aiosqlite = "^0.22.1"
hypothesis = "^6.157.0"
bandit = "^1.8.0"
# NOTE: Schemathesis is intentionally NOT a Poetry dependency. Its transitive
# pins (starlette<1 on 3.x, pytest>=8 on 4.x) conflict with both the runtime
# security fixes (starlette>=1.3.1) and the pinned test stack (pytest 7.4.0).
# DAST runs it from its official Docker image instead — like Trivy/gitleaks/
# Semgrep — so a dev testing tool never constrains the shipped dependency graph.
# See scripts/run_dast.py and TODO item 89.
moto = "^5.2.2"
# Dev-only, unlike pymysql/aiomysql/pyodbc above (2026-08-06
# security-invariant-reviewer finding, TODO item 19 phase 2): no module under
# src/querygate/ imports snowflake.sqlalchemy or snowflake.connector —
# SnowflakeDialectAdapter builds only generic sqlalchemy.func expressions, and
# connections/engine.py's init_engine refuses to open a Snowflake connection
# at all (SessionDialectAdapter.is_connectable() returns False for it), so
# create_async_engine never resolves the "snowflake" dialect entry point in
# production. Only tests/unit/test_dialect_adapters.py imports it, to compile
# against the real dialect object. Shipping snowflake-connector-python's own
# TLS/crypto stack (pyopenssl, asn1crypto) in the release container/package
# for a code path that cannot execute would be unnecessary attack surface and
# an unnecessary CVE-tracking obligation for a self-hosted security gateway.
snowflake-sqlalchemy = "^1.11.0"
# Dev-only, for the identical reason snowflake-sqlalchemy above is (2026-08-07,
# TODO item 19 phase 3): no module under src/querygate/ imports
# sqlalchemy_bigquery or google.cloud.bigquery — BigQueryDialectAdapter builds
# only generic sqlalchemy.func expressions, and connections/engine.py's
# init_engine refuses to open a BigQuery connection at all
# (SessionDialectAdapter.is_connectable() returns False for it, the same
# guard Snowflake uses), so create_async_engine never resolves the "bigquery"
# dialect entry point in production. Only tests/unit/test_dialect_adapters.py
# and tests/unit/test_date_primitives.py import it, to compile against the
# real dialect object. Shipping
# google-cloud-bigquery's own gRPC/auth stack in the release container/package
# for a code path that cannot execute would be unnecessary attack surface and
# an unnecessary CVE-tracking obligation for a self-hosted security gateway.
sqlalchemy-bigquery = "^1.17.0"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
asyncio_mode = "auto"
addopts = [
    "-v",
    "--strict-markers",
    "--tb=short",
    "-m",
    "not real_db",
]
markers = [
    "asyncio: marks tests as async",
    "integration: marks tests as integration tests",
    "unit: marks tests as unit tests",
    "verification: core-guarantee regression tests (see tests/integration/test_core_regression.py)",
    "security: adversarial security regression tests (see tests/security/)",
    "real_db: needs a real database running (see make compose-up) — excluded from the default run",
    "postgres_live: needs a real Postgres server (see TODO.md item 3) — also marked real_db",
    "mssql_live: needs a real MSSQL server (see TODO.md item 2) — also marked real_db",
    "mysql_live: needs a real MySQL server (see TODO.md item 19) — also marked real_db",
    "load: concurrent load/soak verification against a real database (see docs/LOAD_TESTING.md)",
]

# Bandit static security analysis (make sast / the `sast` CI job).
# Scoped to the shipped product source; tests carry deliberate adversarial
# patterns and are not scanned. Findings are deny-by-default — an accepted one
# is annotated inline with `# nosec: <reason>`, never suppressed here wholesale.
[tool.bandit]
exclude_dirs = ["tests", ".venv", "archive", "scripts"]

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
