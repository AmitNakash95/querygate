# Runs the local infrastructure used by QueryGate's example configuration.
# QueryGate itself has no database of its own (connections and policy are
# file-configured, see examples/); Postgres is the demo target database and
# Redis coordinates concurrency limits across QueryGate processes.
services:
  querygate-demo-db:
    image: postgres:15.1
    restart: always
    environment:
      POSTGRES_USER: querygate
      POSTGRES_PASSWORD: querygate
      POSTGRES_DB: querygate_demo
    ports:
      - "127.0.0.1:${QUERYGATE_POSTGRES_PORT:-5433}:5432"
    volumes:
      - ./examples/demo_db/init_postgres.sql:/docker-entrypoint-initdb.d/init_postgres.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U querygate -d querygate_demo"]
      interval: 5s
      timeout: 3s
      retries: 10

  querygate-redis:
    image: redis:7-alpine
    restart: always
    ports:
      # Local development only; production deployments should keep Redis on
      # a private network and require authentication/TLS as appropriate.
      - "127.0.0.1:${QUERYGATE_REDIS_PORT:-6379}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  # Real SQL Server for the `mssql_live` suite (TODO.md item 2). Behind the
  # `mssql` profile so a plain `docker compose up -d` does NOT start it — it is
  # a heavyweight image that most local work does not need, and on Apple Silicon
  # it runs under amd64 emulation (slow to boot, ~2GB RAM). Start it with
  # `make compose-up-mssql`, which `make test-mssql-live` does for you.
  #
  # The credentials are throwaway and match `setup_mssql_test_db.py`'s defaults
  # and the CI service definition — they are dev-only, never real.
  querygate-mssql:
    profiles: ["mssql"]
    image: mcr.microsoft.com/mssql/server:2022-latest
    # Pinned explicitly: the image is amd64-only, so without this Docker on
    # arm64 hosts fails to pull rather than falling back to emulation.
    platform: linux/amd64
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: "QueryGate_Test_Pw1!"
      MSSQL_PID: Developer
      # Deliberately NOT UTC (TODO.md item 102). T-SQL has no session time zone,
      # so MSSQL's UTC guarantee lives entirely in choosing SYSUTCDATETIME() over
      # GETDATE() — and that choice is untestable against a UTC-clocked server,
      # where both return the same value. A half-hour offset is used so no
      # plausible off-by-N-hours bug can imitate it. Mirrors the ALTER ROLE the
      # Postgres suite does from inside its own test.
      TZ: "Pacific/Marquesas"
    ports:
      - "127.0.0.1:${QUERYGATE_MSSQL_PORT:-14330}:1433"
    healthcheck:
      # `sqlcmd -Q` against master is the only reliable readiness signal: the
      # container accepts TCP well before the engine finishes recovery.
      test:
        [
          "CMD-SHELL",
          "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P \"$$MSSQL_SA_PASSWORD\" -C -Q 'SELECT 1' || exit 1",
        ]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 30s

  # Real MySQL for the `mysql_live` suite (TODO.md item 19). Behind the
  # `mysql` profile so a plain `docker compose up -d` does NOT start it,
  # matching the `mssql` profile's reasoning — though unlike MSSQL's image,
  # this one is multi-arch and runs natively on Apple Silicon, no emulation.
  # Start it with `make compose-up-mysql`, which `make test-mysql-live` does
  # for you.
  #
  # The credentials are throwaway and match `setup_mysql_test_db.py`'s
  # defaults and the CI service definition — they are dev-only, never real.
  querygate-mysql:
    profiles: ["mysql"]
    image: mysql:8.4
    environment:
      MYSQL_ROOT_PASSWORD: "QueryGate_Test_Pw1"
      MYSQL_DATABASE: querygate_demo
    ports:
      - "127.0.0.1:${QUERYGATE_MYSQL_PORT:-13306}:3306"
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-uroot", "-pQueryGate_Test_Pw1"]
      interval: 5s
      timeout: 3s
      retries: 30
      start_period: 20s
